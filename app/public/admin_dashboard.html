<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Online Compiler</title>

<link rel="stylesheet" href="/public/admin.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<!-- AUTH CHECK -->
<script>
if (
    localStorage.getItem("loggedIn") !== "true" ||
    localStorage.getItem("role") !== "admin"
) {
    location.href = "/public/login.html";
}
</script>

</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Compiler Admin</h2>

        <ul>
            <li class="active" data-page="dashboard">Dashboard</li>
            <li data-page="questions">Questions</li>
            <li data-page="users">Users</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="content">

        <!-- DASHBOARD -->
        <section id="dashboard" class="page active">
            <h2>Dashboard</h2>

            <div class="cards">
                <div class="card">
                    <h3>Total Questions</h3>
                    <h2 id="questionCount">0</h2>
                </div>

                <div class="card">
                    <h3>Total Test Cases</h3>
                    <h2 id="testcaseCount">0</h2>
                </div>
            </div>
        </section>

        <!-- QUESTIONS -->
        <section id="questions" class="page">
            <h2>Questions</h2>

            <input id="title" placeholder="Question Title">
            <textarea id="description" placeholder="Description" rows="3"></textarea>
            <input id="category" placeholder="Category">

            <select id="difficulty">
                <option>Easy</option>
                <option>Medium</option>
                <option>Hard</option>
            </select>

            <button class="primary" onclick="saveQuestion()">
                Save Question
            </button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Difficulty</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="questionTable"></tbody>
            </table>
        </section>

        <!-- USERS -->
        <section id="users" class="page">
            <h2>Users</h2>
            <p>Coming Soon...</p>
        </section>

    </div>
</div>

<!-- QUESTION DETAIL MODAL -->
<div id="questionModal" class="modal" style="display: none;">
    <div class="modal-content">
        <span class="close" onclick="closeQuestionModal()">&times;</span>
        <h2 id="modalTitle">Question Details</h2>
        <p id="modalDescription"></p>
        <p><strong>Category:</strong> <span id="modalCategory"></span></p>
        <p><strong>Difficulty:</strong> <span id="modalDifficulty"></span></p>

        <h3>Test Cases</h3>
        <div class="testcase-form">
            <input id="modalTestInput" placeholder="Input">
            <input id="modalExpectedOutput" placeholder="Expected Output">
            <label><input type="checkbox" id="modalTestHidden"> Hidden</label>
            <button class="success" onclick="addModalTestCase()">Add Test Case</button>
        </div>

        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Input</th>
                    <th>Expected Output</th>
                    <th>Visibility</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="modalTestcaseTable"></tbody>
        </table>
    </div>
</div>

<style>
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
}

.modal-content {
    background-color: #fefefe;
    margin: 5% auto;
    padding: 20px;
    border: 1px solid #888;
    width: 80%;
    max-width: 800px;
    max-height: 80vh;
    overflow-y: auto;
}

.close {
    color: #aaa;
    float: right;
    font-size: 28px;
    font-weight: bold;
    cursor: pointer;
}

.close:hover {
    color: black;
}

.testcase-form {
    display: flex;
    gap: 10px;
    margin: 10px 0;
    align-items: center;
}

.testcase-form input {
    flex: 1;
}

.testcase-form label {
    white-space: nowrap;
}
</style>

<script src="/public/admin.js"></script>

</body>
</html>
