<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Online Compiler</title>

<link rel="stylesheet" href="/public/admin.css">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css" rel="stylesheet">

<!-- AUTH CHECK -->
<script>
if (
    localStorage.getItem("loggedIn") !== "true" ||
    localStorage.getItem("role") !== "admin"
) {
    location.href = "/public/login.html";
}
</script>

</head>

<body>

<div class="container">

    <!-- SIDEBAR -->
    <aside class="sidebar">
        <h2>Compiler Admin</h2>

        <ul>
            <li class="active" data-page="dashboard">Dashboard</li>
            <li data-page="questions">Questions</li>
            <li data-page="testcases">Test Cases</li>
            <li data-page="users">Users</li>
            <li onclick="logout()">Logout</li>
        </ul>
    </aside>

    <!-- MAIN CONTENT -->
    <div class="content">

        <!-- DASHBOARD -->
        <section id="dashboard" class="page active">
            <h2>Dashboard</h2>

            <div class="cards">
                <div class="card">
                    <h3>Total Questions</h3>
                    <h2 id="questionCount">0</h2>
                </div>

                <div class="card">
                    <h3>Total Test Cases</h3>
                    <h2 id="testcaseCount">0</h2>
                </div>
            </div>
        </section>

        <!-- QUESTIONS -->
        <section id="questions" class="page">
            <h2>Questions</h2>

            <input id="title" placeholder="Question Title">
            <input id="category" placeholder="Category">

            <select id="difficulty">
                <option>Easy</option>
                <option>Medium</option>
                <option>Hard</option>
            </select>

            <button class="primary" onclick="saveQuestion()">
                Save Question
            </button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Difficulty</th>
                        <th>Category</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="questionTable"></tbody>
            </table>
        </section>

        <!-- TEST CASES -->
        <section id="testcases" class="page">
            <h2>Test Cases</h2>

            <input id="testInput" placeholder="Input">
            <input id="expectedOutput" placeholder="Output">

            <button class="success" onclick="addTestCase()">
                Add Test Case
            </button>

            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Input</th>
                        <th>Visibility</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="testcaseTable"></tbody>
            </table>
        </section>

        <!-- USERS -->
        <section id="users" class="page">
            <h2>Users</h2>
            <p>Coming Soon...</p>
        </section>

    </div>
</div>

<script src="/public/admin.js"></script>

</body>
</html>
